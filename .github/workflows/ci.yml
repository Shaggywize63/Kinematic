name: CI

# Typecheck + build + test gate so a TypeScript/logic error can't reach main.
# Deploy is NOT part of this workflow — the backend ships via the separate
# "Deploy backend to AWS (Mumbai)" workflow (.github/workflows/deploy-aws.yml).
# (The old "Deploy to Railway" job here was removed after the AWS migration
#  decommissioned Railway; with no RAILWAY_TOKEN it failed on every push to
#  main, keeping main perpetually red and masking real CI failures.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No package-lock.json is committed (it is gitignored), so `npm ci` is not
      # usable here; `npm install` resolves the declared ranges.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck & build (tsc)
        run: npm run build

  test:
    name: Jest (integration + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The Supabase client is mocked (data-layer tests) or bypassed via the
      # demo token (HTTP E2E), so no live Supabase is needed. setupEnv.ts fills
      # in placeholder Supabase env vars the app asserts at boot.
      - name: Run tests
        run: npm run test:ci
