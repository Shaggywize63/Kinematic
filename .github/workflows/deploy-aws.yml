name: Deploy backend to AWS (Mumbai)

# Builds the backend Docker image, pushes it to Amazon ECR in ap-south-1, then
# rolls the ECS service so the new image goes live.
# Auth is keyless via GitHub OIDC assuming the kinematic-github-deploy role —
# there are NO long-lived AWS keys in GitHub secrets.
#
# The ECS task definition (kinematic-backend) pins the image tag to `:latest`,
# which this workflow re-pushes on every main run. Fargate re-pulls `:latest`
# on task launch, so a force-new-deployment is all that's needed.
#
# Multi-arch, built NATIVELY (no QEMU): each architecture builds on its own
# native runner (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm) in parallel,
# then a merge job stitches the two per-arch images into one manifest list. The
# per-commit `:${sha}` manifest is always assembled so any branch push validates
# both arch builds; only main also moves `:latest` and deploys — a feature-branch
# WIP push must never clobber what production pulls.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/intelligent-cannon-pgp9vy]
    paths-ignore:
      - '**.md'

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kinematic-backend
  AWS_ROLE_ARN: arn:aws:iam::023620758744:role/kinematic-github-deploy

jobs:
  build:
    # One native runner per architecture — no emulation, so each build is fast.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push per-arch image (native, no QEMU)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${ECR_REPOSITORY}"
          docker build -t "$IMAGE:${{ github.sha }}-${{ matrix.arch }}" .
          docker push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  manifest-and-deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Assemble multi-arch manifest (:sha always; :latest on main)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${ECR_REPOSITORY}"
          TAGS=(-t "$IMAGE:${{ github.sha }}")
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS+=(-t "$IMAGE:latest")
          fi
          # imagetools stitches the two native per-arch images into one manifest
          # list, server-side — no re-pull, no emulation.
          docker buildx imagetools create "${TAGS[@]}" \
            "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
          echo "Assembled multi-arch $IMAGE:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then echo "Moved $IMAGE:latest"; fi

      - name: Deploy to ECS (roll the service onto the new :latest image)
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service \
            --cluster kinematic \
            --service kinematic-backend \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --no-cli-pager
          echo "Waiting for the ECS service to reach a stable state…"
          aws ecs wait services-stable \
            --cluster kinematic \
            --services kinematic-backend \
            --region "$AWS_REGION"
          echo "kinematic-backend deployment stable."
