name: Deploy backend to AWS (Mumbai)

# Builds the backend Docker image, pushes it to Amazon ECR in ap-south-1, then
# rolls the ECS service so the new image goes live.
# Auth is keyless via GitHub OIDC assuming the kinematic-github-deploy role —
# there are NO long-lived AWS keys in GitHub secrets.
#
# The ECS task definition (kinematic-backend) pins the image tag to `:latest`,
# which this workflow re-pushes on every run. Because the tag is stable, a
# force-new-deployment is all that's needed to pull the freshly-built image —
# no taskdef re-render required. Fargate re-pulls `:latest` on task launch.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/intelligent-cannon-pgp9vy]
    paths-ignore:
      - '**.md'

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kinematic-backend
  AWS_ROLE_ARN: arn:aws:iam::023620758744:role/kinematic-github-deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${ECR_REPOSITORY}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:${{ github.sha }}"

      - name: Deploy to ECS (roll the service onto the new :latest image)
        run: |
          aws ecs update-service \
            --cluster kinematic \
            --service kinematic-backend \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --no-cli-pager
          echo "Waiting for the ECS service to reach a stable state…"
          aws ecs wait services-stable \
            --cluster kinematic \
            --services kinematic-backend \
            --region "$AWS_REGION"
          echo "kinematic-backend deployment stable."
