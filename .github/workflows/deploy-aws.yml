name: Deploy backend to AWS (Mumbai)

# Builds the backend Docker image, pushes it to Amazon ECR in ap-south-1, then
# rolls the ECS service so the new image goes live.
# Auth is keyless via GitHub OIDC assuming the kinematic-github-deploy role —
# there are NO long-lived AWS keys in GitHub secrets.
#
# The ECS task definition (kinematic-backend) pins the image tag to `:latest`,
# which this workflow re-pushes on every run. Because the tag is stable, a
# force-new-deployment is all that's needed to pull the freshly-built image —
# no taskdef re-render required. Fargate re-pulls `:latest` on task launch.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/intelligent-cannon-pgp9vy]
    paths-ignore:
      - '**.md'

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kinematic-backend
  AWS_ROLE_ARN: arn:aws:iam::023620758744:role/kinematic-github-deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64 emulation for the cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (multi-arch amd64+arm64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${ECR_REPOSITORY}"
          # Build a single manifest list carrying both linux/amd64 and
          # linux/arm64 so the ECS task can run on Graviton/ARM64 (cheaper)
          # while amd64 stays available in the same tag for instant rollback.
          # Always build + push the immutable per-commit tag so any branch
          # push validates BOTH arch builds. Only main moves the `:latest`
          # tag the running task definition pins to — a feature-branch WIP
          # push must never clobber what production pulls.
          # --provenance=false keeps the manifest list to the two platform
          # images so Fargate image resolution stays unambiguous.
          TAGS=(-t "$IMAGE:${{ github.sha }}")
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS+=(-t "$IMAGE:latest")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            "${TAGS[@]}" \
            --push .
          echo "Pushed multi-arch $IMAGE:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then echo "Moved $IMAGE:latest"; fi

      - name: Deploy to ECS (roll the service onto the new :latest image)
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service \
            --cluster kinematic \
            --service kinematic-backend \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --no-cli-pager
          echo "Waiting for the ECS service to reach a stable state…"
          aws ecs wait services-stable \
            --cluster kinematic \
            --services kinematic-backend \
            --region "$AWS_REGION"
          echo "kinematic-backend deployment stable."
